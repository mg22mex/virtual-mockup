# Keep the Streamlit Community Cloud app from sleeping.
# Plain curl/HTTP is not enough — Cloud serves a static shell until a real
# browser session opens (WebSocket). Playwright does that.
#
# This does NOT speed up cold env rebuilds after a reboot or dependency change;
# it only reduces “Zzz / get this app back up” between normal visits.

name: Keep Streamlit awake

on:
  schedule:
    # Every 2 hours (UTC). Community Cloud can sleep within ~half a day of
    # idle; 6h left long gaps. 2h keeps a real browser session more often.
    # Cost: ~12 Playwright runs/day (~1–3 min each) — fine on public repos.
    - cron: "20 */2 * * *"
  workflow_dispatch:

concurrency:
  group: streamlit-keepalive
  cancel-in-progress: true

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install --quiet playwright
          playwright install chromium --with-deps

      - name: Wake app
        env:
          STREAMLIT_APP_URL: https://virtual-mockup-85kxgyfvpa82a669bqjuqg.streamlit.app/
          KEEPALIVE_HOLD_SECONDS: "60"
        run: python scripts/keepalive.py
