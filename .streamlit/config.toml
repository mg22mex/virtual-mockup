[theme]
base = "light"
primaryColor = "#262D65"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F4EF"
textColor = "#111111"
linkColor = "#262D65"
borderColor = "#D8D8D4"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
baseFontSize = 15
headingFontSizes = ["28px", "22px", "18px", "16px", "14px", "12px"]
headingFontWeights = [700, 700, 600, 600, 600, 600]
baseRadius = "none"
buttonRadius = "none"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false
blueColor = "#262D65"
grayColor = "#666666"

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F4EF"
textColor = "#111111"
borderColor = "#D8D8D4"
primaryColor = "#262D65"
